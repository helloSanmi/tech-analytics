name: Build and deploy Node.js app to Azure Web App - nestanalytics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build Next.js app
        run: |
          npm ci
          npm run build

      - name: Zip build output for deployment
        run: |
          mkdir build
          mv .next build/.next
          mv public build/public
          mv package.json build/package.json
          mv package-lock.json build/package-lock.json
          cd build && zip -r ../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          mkdir deployment
          unzip release.zip -d deployment

      - name: Install production dependencies
        run: |
          cd deployment
          npm ci --production

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'nestanalytics'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5FFE10C020BF4FC69E172940382D7172 }}
          package: ./deployment
